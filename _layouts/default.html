<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
    <meta name="theme-color" content="#faf6ee" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14110d" media="(prefers-color-scheme: dark)">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
    {% feed_meta %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="site-header__bar">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav aria-label="Primary">
          <a href="{{ '/' | relative_url }}">Posts</a>
          <a href="{{ '/workflow/' | relative_url }}">Workflow</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
        </nav>
      </div>
    </header>

    <main class="container" id="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <p>Source-grounded summaries by {{ site.author.name | default: site.title }}. Draft unpublished; publish deliberately.</p>
        <span class="footer-mark">Sakul Learning</span>
      </div>
    </footer>
  </body>
</html>
