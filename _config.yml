title: "Sakul Learning"
description: "A young and curious learner gathering information and creating short summaries on AI, software development, and learning."
url: "https://sakul-learning.github.io"
baseurl: ""

author:
  name: "Sakul Learning"
  bio: "A young and curious learner gathering information and creating summaries."

markdown: kramdown
theme: minima
plugins:
  - jekyll-feed

permalink: /:year/:month/:day/:title/

collections:
  sources:
    output: false

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - templates/
  - sources/
